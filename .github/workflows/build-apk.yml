name: Build PSX Smart Screener APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle Wrapper Automatically
        run: |
          # پروجیکٹ میں build.gradle فائل تلاش کریں
          GRADLE_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: build.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # اگر gradlew نہ ملے تو اسے خود بخود بنا لیں
          if [ ! -f gradlew ]; then
            echo "gradlew is missing. Generating it automatically..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi

          chmod +x gradlew
          echo "BUILD_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build Android APK with Gradle
        run: |
          cd "$BUILD_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSX-Smart-Screener-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
