name: Build PSX Smart Screener APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate and Grant execute permission for gradlew
        run: |
          # پروجیکٹ میں gradlew فائل کو خود بخود تلاش کریں
          GRADLEW_PATH=$(find . -name "gradlew" -type f)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew file not found in the repository!"
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          
          # اس فولڈر کا راستہ محفوظ کریں جہاں gradlew موجود ہے
          DIR_PATH=$(dirname "$GRADLEW_PATH")
          echo "BUILD_DIR=$DIR_PATH" >> $GITHUB_ENV

      - name: Build Android APK with Gradle
        run: |
          cd "$BUILD_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSX-Smart-Screener-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
