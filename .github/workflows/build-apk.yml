name: Build PSX Smart Screener APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK and Build APK
        run: |
          # GitHub رنر پر پہلے سے موجود Android SDK کا راستہ سیٹ کریں
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          # پروجیکٹ میں build.gradle تلاش کریں
          GRADLE_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: build.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # اینڈرائیڈ ایس ڈی کے لائسنس خود بخود قبول کریں
          yes | sdkmanager --licenses || true

          # اگر gradlew نہ ملے تو Gradle 8.5 ڈاؤن لوڈ کر کے ریپر بنا لیں
          if [ ! -f gradlew ]; then
            echo "gradlew is missing. Downloading Gradle 8.5..."
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q gradle-8.5-bin.zip
            ./gradle-8.5/bin/gradle wrapper
          fi

          chmod +x gradlew
          echo "Building APK..."
          ./gradlew assembleDebug --no-daemon --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSX-Smart-Screener-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
